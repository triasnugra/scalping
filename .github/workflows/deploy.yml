name: Monitor Scalping (msc)

on:
  schedule:
    - cron: "*/15 * * * *"      # best-effort; GitHub bisa menunda beberapa menit
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write                  # untuk notifikasi upgrade (GitHub Issue)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tes (kualitas, adapter, analitik, build)
        run: node --test
      - id: pages
        uses: actions/configure-pages@v5
      - name: Bangun data monitor
        env:
          GH_TOKEN: ${{ secrets.ENGINES_TOKEN }}        # opsional: hanya bila repo mesin PRIVAT
          PREV_PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/build.mjs
      - name: Notifikasi upgrade (GitHub Issue, opsional Telegram)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/notify.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
